name: Release

on:
  push:
    tags:
      - 'forge-*-v*'
      - 'neoforge-*-v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Tag Toolchain
        id: toolchain
        run: |
          REF_NAME="${{ github.ref_name }}"

          case "$REF_NAME" in
            forge-1.12.2-v*)    TARGET_REF="forge/1.12.2";    JAVA_VERSION=8  ;;
            forge-1.13.2-v*)    TARGET_REF="forge/1.13.2";    JAVA_VERSION=11 ;;
            forge-1.14.4-v*)    TARGET_REF="forge/1.14.4";    JAVA_VERSION=11 ;;
            forge-1.15.2-v*)    TARGET_REF="forge/1.15.2";    JAVA_VERSION=11 ;;
            forge-1.16.5-v*)    TARGET_REF="forge/1.16.5";    JAVA_VERSION=8  ;;
            forge-1.18.2-v*)    TARGET_REF="forge/1.18.2";    JAVA_VERSION=17 ;;
            forge-1.19.2-v*)    TARGET_REF="forge/1.19.2";    JAVA_VERSION=17 ;;
            forge-1.20.1-v*)    TARGET_REF="forge/1.20.1";    JAVA_VERSION=17 ;;
            neoforge-1.20.2-v*) TARGET_REF="neoforge/1.20.2"; JAVA_VERSION=17 ;;
            neoforge-1.20.4-v*) TARGET_REF="neoforge/1.20.4"; JAVA_VERSION=17 ;;
            neoforge-1.20.6-v*) TARGET_REF="neoforge/1.20.6"; JAVA_VERSION=21 ;;
            neoforge-1.21.4-v*) TARGET_REF="neoforge/1.21.4"; JAVA_VERSION=21 ;;
            *) echo "::error::Unsupported tag: $REF_NAME"; exit 1 ;;
          esac

          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "gradle_args=clean build generatePvpPunishConfig buildRelease" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_version }}

      - name: Checkout Target Branch
        run: git checkout ${{ steps.toolchain.outputs.target_ref }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Properties For CI
        run: |
          sed -i '/^systemProp\.\(http\|https\)\.proxy\(Host\|Port\)=/d' gradle.properties

      - name: Build Release Artifacts
        run: chmod +x gradlew && ./gradlew ${{ steps.toolchain.outputs.gradle_args }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*
            dist/*.zip
