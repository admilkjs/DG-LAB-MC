name: Build

on:
  push:
    branches:
      - 'forge/**'
      - 'neoforge/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '*.pulse'
      - 'LICENSE.txt'
      - 'CREDITS.txt'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Branch Toolchain
        id: toolchain
        run: |
          REF_NAME="${{ github.head_ref }}"
          if [ -z "$REF_NAME" ]; then
            REF_NAME="${{ github.ref_name }}"
          fi

          case "$REF_NAME" in
            forge/1.12.2)       JAVA_VERSION=8  ;;
            forge/1.16.5)       JAVA_VERSION=8  ;;
            forge/1.18.2)       JAVA_VERSION=17 ;;
            forge/1.19.2)       JAVA_VERSION=17 ;;
            forge/1.20.1)       JAVA_VERSION=17 ;;
            neoforge/1.20.2)    JAVA_VERSION=17 ;;
            neoforge/1.20.4)    JAVA_VERSION=17 ;;
            neoforge/1.20.6)    JAVA_VERSION=21 ;;
            *) echo "::error::Unsupported branch: $REF_NAME"; exit 1 ;;
          esac

          ARTIFACT_NAME=$(echo "$REF_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')

          echo "ref_name=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "gradle_args=clean build generatePvpPunishConfig buildRelease" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Properties For CI
        run: |
          sed -i '/^systemProp\.\(http\|https\)\.proxy\(Host\|Port\)=/d' gradle.properties

      - name: Build
        run: ./gradlew ${{ steps.toolchain.outputs.gradle_args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.toolchain.outputs.artifact_name }}-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/release/*
            dist/*.zip
