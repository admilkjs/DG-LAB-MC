name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Properties For CI
        shell: pwsh
        run: |
          $path = 'gradle.properties'
          $lines = Get-Content -LiteralPath $path
          $filtered = $lines | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' }
          Set-Content -LiteralPath $path -Value $filtered -Encoding utf8

      - name: Build Mod
        shell: pwsh
        run: .\gradlew.bat shadowJar reobfShadowJar generatePvpPunishConfig --no-daemon

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dglabmc-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/libs/*.jar
            dist/*.zip
