name: Build

on:
  push:
    branches:
      - 'forge/**'
      - 'neoforge/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Branch Toolchain
        id: toolchain
        shell: pwsh
        run: |
          $refName = "${{ github.head_ref }}"
          if ([string]::IsNullOrWhiteSpace($refName)) {
            $refName = "${{ github.ref_name }}"
          }

          switch ($refName) {
            'forge/1.12.2' { $javaVersion = '8' }
            'forge/1.13.2' { $javaVersion = '11' }
            'forge/1.14.4' { $javaVersion = '11' }
            'forge/1.15.2' { $javaVersion = '11' }
            'forge/1.16.5' { $javaVersion = '8' }
            'forge/1.18.2' { $javaVersion = '17' }
            'forge/1.19.2' { $javaVersion = '17' }
            'forge/1.20.1' { $javaVersion = '17' }
            'neoforge/1.20.2' { $javaVersion = '17' }
            'neoforge/1.20.4' { $javaVersion = '17' }
            'neoforge/1.20.6' { $javaVersion = '21' }
            'neoforge/1.21.4' { $javaVersion = '21' }
            default { throw "Unsupported branch for build workflow: $refName" }
          }

          "ref_name=$refName" >> $env:GITHUB_OUTPUT
          "artifact_name=$($refName -replace '[^A-Za-z0-9._-]', '-')" >> $env:GITHUB_OUTPUT
          "java_version=$javaVersion" >> $env:GITHUB_OUTPUT
          "gradle_args=clean build generatePvpPunishConfig buildRelease --no-daemon" >> $env:GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Properties For CI
        shell: pwsh
        run: |
          $path = 'gradle.properties'
          $lines = Get-Content -LiteralPath $path
          $filtered = $lines | Where-Object { $_ -notmatch '^systemProp\.(http|https)\.proxy(Host|Port)=' }
          Set-Content -LiteralPath $path -Value $filtered -Encoding utf8

      - name: Build
        shell: pwsh
        run: .\gradlew.bat ${{ steps.toolchain.outputs.gradle_args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.toolchain.outputs.artifact_name }}-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist/release/*
            dist/*.zip
