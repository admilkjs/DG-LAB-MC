name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare wrappers
        shell: bash
        run: |
          chmod +x gradlew
          find adapters -name gradlew -exec chmod +x {} \;

      - name: Build all enabled targets
        run: ./gradlew buildAll --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dglabmc-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            adapters/*/dist/release/*
