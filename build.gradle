plugins {
    id 'base'
}

def targetFile = layout.projectDirectory.file('gradle/targets.properties').asFile
def targets = new Properties()
if (targetFile.isFile()) {
    targetFile.withInputStream { targets.load(it) }
}

def enabledTargets = targets.stringPropertyNames()
    .findAll { it.endsWith('.enabled') && 'true'.equalsIgnoreCase(targets.getProperty(it)) }
    .collect { it.substring(0, it.length() - '.enabled'.length()) }
    .sort()

def targetPath = { String target ->
    def path = targets.getProperty("${target}.path")
    if (path == null || path.trim().isEmpty()) {
        throw new GradleException("Unknown target: ${target}")
    }
    return file(path)
}

def runTarget = { String target ->
    def directory = targetPath(target)
    def wrapper = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'gradlew.bat' : './gradlew'
    if (!file(directory).isDirectory()) {
        throw new GradleException("Target directory does not exist: ${directory}")
    }
    exec {
        workingDir directory
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            commandLine 'cmd', '/c', wrapper, 'buildRelease', '--no-daemon'
        } else {
            commandLine wrapper, 'buildRelease', '--no-daemon'
        }
    }
}

tasks.register('buildTarget') {
    group = 'build'
    description = 'Build one enabled Minecraft adapter: --project-prop target=forge-1.20.1'
    dependsOn ':core:build'
    doLast {
        def target = providers.gradleProperty('target').orNull
        if (target == null || !enabledTargets.contains(target)) {
            throw new GradleException("Set -Ptarget to one of: ${enabledTargets.join(', ')}")
        }
        runTarget(target)
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build all enabled Minecraft adapters sequentially.'
    dependsOn ':core:build'
    doLast {
        enabledTargets.each { runTarget(it) }
    }
}

tasks.register('printTargets') {
    group = 'help'
    doLast {
        enabledTargets.each { target ->
            println "${target}: ${targets.getProperty("${target}.loader")} ${targets.getProperty("${target}.minecraft")} (Java ${targets.getProperty("${target}.java")})"
        }
    }
}
