plugins {
    id 'base'
}

def targetFile = layout.projectDirectory.file('gradle/targets.properties').asFile
def targets = new Properties()
if (targetFile.isFile()) {
    targetFile.withInputStream { targets.load(it) }
}

def enabledTargets = targets.stringPropertyNames()
    .findAll { it.endsWith('.enabled') && 'true'.equalsIgnoreCase(targets.getProperty(it)) }
    .collect { it.substring(0, it.length() - '.enabled'.length()) }
    .sort()

def targetPath = { String target ->
    def path = targets.getProperty("${target}.path")
    if (path == null || path.trim().isEmpty()) {
        throw new GradleException("Unknown target: ${target}")
    }
    return file(path)
}

def resolveJavaHome = { String target ->
    def javaVersion = targets.getProperty("${target}.java")
    if (javaVersion == null) {
        return null
    }
    def envNames = [
        "JAVA${javaVersion}_HOME",
        "JAVA_HOME_${javaVersion}",
        "JAVA_HOME_${javaVersion}_X64"
    ]
    for (String envName : envNames) {
        def value = System.getenv(envName)
        if (value != null && file(value).isDirectory()) {
            return file(value).absolutePath
        }
    }

    def userHome = System.getProperty('user.home')
    def programFiles = System.getenv('ProgramFiles')
    def candidates = []
    if (programFiles != null) {
        def javaRoot = new File(programFiles, 'Java')
        def adoptiumRoot = new File(programFiles, 'Eclipse Adoptium')
        candidates += (javaRoot.listFiles() ?: []).findAll { it.isDirectory() && (it.name.startsWith("jdk-${javaVersion}") || it.name.startsWith("jre${javaVersion}")) }
        candidates += (adoptiumRoot.listFiles() ?: []).findAll { it.isDirectory() && it.name.contains("-${javaVersion}.") }
    }
    if (userHome != null) {
        def gradleJdks = new File(userHome, '.gradle/jdks')
        candidates += (gradleJdks.listFiles() ?: []).findAll { it.isDirectory() && it.name.toLowerCase().contains("-${javaVersion}-") }
    }
    def executableName = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'java.exe' : 'java'
    def requiresCompiler = javaVersion in ['8', '11', '17', '21']
    return candidates.find { candidate ->
        candidate.isDirectory()
            && new File(candidate, "bin/${executableName}").isFile()
            && (!requiresCompiler || new File(candidate, 'bin/javac.exe').isFile() || new File(candidate, 'bin/javac').isFile())
    }?.absolutePath
}

def runTarget = { String target ->
    def directory = targetPath(target)
    def wrapper = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'gradlew.bat' : './gradlew'
    if (!file(directory).isDirectory()) {
        throw new GradleException("Target directory does not exist: ${directory}")
    }
    def javaHome = resolveJavaHome(target)
    println "Building ${target} with JAVA_HOME=${javaHome ?: 'inherited'}"
    exec {
        workingDir directory
        if (javaHome != null) {
            environment 'JAVA_HOME', javaHome
        }
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            commandLine 'cmd', '/c', wrapper, 'buildRelease', '--no-daemon'
        } else {
            commandLine wrapper, 'buildRelease', '--no-daemon'
        }
    }
}

tasks.register('buildTarget') {
    group = 'build'
    description = 'Build one enabled Minecraft adapter: --project-prop target=forge-1.20.1'
    dependsOn ':core:build'
    doLast {
        def target = providers.gradleProperty('target').orNull
        if (target == null || !enabledTargets.contains(target)) {
            throw new GradleException("Set -Ptarget to one of: ${enabledTargets.join(', ')}")
        }
        runTarget(target)
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build all enabled Minecraft adapters sequentially.'
    dependsOn ':core:build'
    doLast {
        enabledTargets.each { runTarget(it) }
    }
}

tasks.register('printTargets') {
    group = 'help'
    doLast {
        enabledTargets.each { target ->
            println "${target}: ${targets.getProperty("${target}.loader")} ${targets.getProperty("${target}.minecraft")} (Java ${targets.getProperty("${target}.java")})"
            println "  JAVA_HOME=${resolveJavaHome(target) ?: 'inherited'}"
        }
    }
}
