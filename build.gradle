buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id
archivesBaseName = mod_id

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

configurations {
    shade
    compile.extendsFrom shade
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2861'
    compile 'com.google.zxing:core:3.5.3'
    shade 'com.google.zxing:core:3.5.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
}

processResources {
    inputs.property 'version', mod_version
    inputs.property 'mcversion', minecraft_version
    inputs.property 'modid', mod_id
    inputs.property 'name', mod_name
    inputs.property 'description', mod_description
    inputs.property 'authors', mod_authors

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        include 'pack.mcmeta'
        expand(
            version: mod_version,
            mcversion: minecraft_version,
            modid: mod_id,
            name: mod_name,
            description: mod_description,
            authors: mod_authors
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
        exclude 'pack.mcmeta'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : "${version}",
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', 'module-info.class'
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

task generatePvpPunishConfig(type: JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    main = 'dglabmc.tool.PvpPunishConfigGenerator'
    workingDir = project.projectDir
    args "${project.projectDir}/dist/dglabmc-pvp-punish.zip"
    jvmArgs '-Dfile.encoding=UTF-8'
}

task copyReleaseArtifacts(type: Copy) {
    dependsOn 'reobfJar'
    into file("${project.projectDir}/dist/release")
    from("${buildDir}/reobfJar/output.jar") {
        rename { String ignored ->
            "${mod_id}-${mod_version}-release.jar"
        }
    }
}

task buildRelease {
    group = 'build'
    description = 'Builds the Forge 1.12.2 jar and copies release artifacts to dist/release.'
    dependsOn copyReleaseArtifacts
}
